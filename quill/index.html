<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Quill - Episodes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Quill - Bringing Lost Stories to Life. Every episode, all in one place.">
<!-- quill.thegrove.media was attached as a Cloudflare Pages custom domain 2026-08-10 and is
     active, so this is the real canonical home. The page is still reachable at
     thegrove.media/quill/, which the hostname-routing Pages Function serves from the same files. -->
<link rel="canonical" href="https://quill.thegrove.media/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/quill-page.css">
</head>
<body>
  <template id="corner-svg-template">
    <svg viewBox="-4 -4 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 23 C1.6 23 0.8 11.5 2 2 C2 2 12.4 1 24 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26.5 0 L31.5 -3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="33" cy="-4.4" r="1.5" fill="currentColor"/>
    </svg>
  </template>

  <main>
    <section class="frame masthead" id="masthead">
      <div class="masthead-content">
        <div class="mark-circle">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 24 C6 24 18 21 24 6" stroke="#E8DFC9" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M6 24 C6 24 9 15 24 6" stroke="#E8DFC9" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4.5 25.5 L8 22" stroke="#C2643A" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="font-display wordmark">The Quill</h1>
        <p class="tagline">Bringing Lost Stories to Life</p>

        <div class="profile-links">
          <a href="https://www.youtube.com/@thequill-stories" class="tap profile-icon" aria-label="Watch on YouTube">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="5" width="20" height="14" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 9.5L15 12L10.5 14.5V9.5Z" fill="currentColor"/></svg>
          </a>
          <a href="https://open.spotify.com/show/033Z9ZjeNm1bOgALYHiYv0" class="tap profile-icon" aria-label="Listen on Spotify">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/><path d="M7 10.2C10 9 15 9.3 17.3 11.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7.6 13C10 12.1 13.8 12.3 15.8 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.2 15.7C10.2 15 12.9 15.1 14.5 16.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </a>
          <a href="https://podcasts.apple.com/us/podcast/the-quill-%7C-bringing-lost-stories-to-life/id6796899950" class="tap profile-icon" aria-label="Listen on Apple Podcasts">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10.4" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M8.4 18.2C8.9 15.3 10.2 14 12 14C13.8 14 15.1 15.3 15.6 18.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </a>
          <a href="https://www.instagram.com/TheQuillTrueStories" class="tap profile-icon" aria-label="Follow on Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="16.6" cy="7.4" r="1" fill="currentColor"/></svg>
          </a>
          <a href="https://www.facebook.com/TheQuillTrueStories" class="tap profile-icon" aria-label="Follow on Facebook">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/><path d="M13.6 20V12.6H15.8L16.1 10H13.6V8.4C13.6 7.7 13.8 7.2 14.8 7.2H16.2V4.9C15.6 4.8 14.9 4.7 14.2 4.7C12.1 4.7 10.7 6 10.7 8.2V10H8.4V12.6H10.7V20" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </a>
          <a href="https://www.tiktok.com/@thequilltruestories" class="tap profile-icon" aria-label="Follow on TikTok">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 3.5C13.4 5.6 14.9 7.2 17 7.5V10.1C15.6 10.1 14.3 9.6 13.2 8.8V15.2C13.2 17.9 11 20 8.4 20C5.8 20 3.6 17.9 3.6 15.2C3.6 12.6 5.8 10.5 8.4 10.5C8.7 10.5 9 10.5 9.3 10.6V13.2C9 13.1 8.7 13 8.4 13C7.1 13 6.1 14 6.1 15.2C6.1 16.5 7.1 17.5 8.4 17.5C9.7 17.5 10.7 16.5 10.7 15.2V3.5H13Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round" fill="none"/></svg>
          </a>
        </div>
      </div>
    </section>

    <section id="latest-section">
      <div class="section-heading">
        <span class="ember-dot" aria-hidden="true"></span>
        <h2 class="font-display">Latest Story</h2>
      </div>
      <article id="latest-card" class="frame" aria-live="polite">
        <p class="loading-note">Loading...</p>
      </article>
    </section>

    <section>
      <div class="section-heading">
        <span class="ember-dot" aria-hidden="true"></span>
        <h2 class="font-display">Most Popular</h2>
      </div>
      <div id="popular-scroll" class="popular-scroll popular-grid"></div>
    </section>

    <section>
      <div class="filter-row" role="group" aria-label="Filter stories by format">
        <button type="button" class="chip tap" data-format="battle" aria-pressed="true">Battle</button>
        <button type="button" class="chip tap" data-format="trial" aria-pressed="true">Trial</button>
        <button type="button" class="chip tap" data-format="chapters" aria-pressed="true">My Lost Chapters</button>
      </div>
    </section>

    <section class="section-tight">
      <div class="section-heading">
        <h2 class="font-display">All Stories</h2>
      </div>
      <div id="episode-list" class="episode-list" aria-live="polite"></div>
      <div id="empty-state" class="empty-state">
        <p class="empty-title font-display">No stories match.</p>
        <p class="empty-subtitle">Tap a chip above to bring them back.</p>
      </div>
    </section>

    <footer class="site-footer">
      <p>The Quill - Bringing Lost Stories to Life</p>
    </footer>
  </main>

  <script src="js/quill-page.js" defer></script>
</body>
</html>
